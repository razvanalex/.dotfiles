# Generated by Hyprland Lua Config Generator
# Do not edit hyprland.conf directly; modify ~/.config/hypr/lua/*.lua instead

$mainMod = Super
$files = nautilus
$terminal = kitty
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts

# Environment Variables
env = AQ_DRM_DEVICES,/dev/dri/card1
env = CLUTTER_BACKEND,wayland
env = GDK_BACKEND,wayland,x11
env = MOZ_DISABLE_RDD_SANDBOX,1
env = XDG_SESSION_TYPE,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = CURSOR,Bibata-Modern-Classic
env = CURSORTHEME,Bibata-Modern-Classic
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = CURSORSIZE,24
env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = TRANSPARENT,true
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = QT_SCALE_FACTOR,1
env = EGL_PLATFORM,wayland
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XDG_SESSION_DESKTOP,Hyprland
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORMTHEME,qt6ct

# Monitors
monitor=,preferred,auto,1,vrr,1,bitdepth,10,cm,srgb
monitor=HEADLESS-2,2560x1600@60,auto,1.25

# Autostart Apps & Services
exec-once = tmux setenv -g HYPRLAND_INSTANCE_SIGNATURE "$HYPRLAND_INSTANCE_SIGNATURE"
exec-once = gsettings set org.gnome.desktop.interface cursor-theme "Bibata-Modern-Classic"
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = sleep 5s && systemctl --user start hyprland.target
exec-once = $scriptsDir/wait-for-tray.sh systemctl --user restart sunshine.service
exec-once = $scriptsDir/Polkit.sh
exec-once = quickshell &
exec-once = $scriptsDir/wait-for-tray.sh blueman-applet &
exec-once = $scriptsDir/wait-for-tray.sh solaar -w hide &
exec-once = openrgb --server --mode static --color 000000 &
exec-once = bash -l -c "sleep 10 && aw-qt &>> ~/.cache/activitywatch/log/aw-qt.log" &
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle &
exec-once = pypr &
exec-once = $UserScripts/WallpaperAutoChange.sh &
exec-shutdown = systemctl --user stop hyprland.target
exec-shutdown = systemctl --user stop sunshine.service

# Settings
misc {
  middle_click_paste = false
  disable_hyprland_logo = true
  initial_workspace_tracking = 0
  enable_swallow = true
  mouse_move_enables_dpms = true
  swallow_regex = ^(kitty)$
  focus_on_activate = true
  disable_splash_rendering = true
}

general {
  allow_tearing = false
  border_size = 2
  gaps_out = 5
  gaps_in = 2
  col.inactive_border = rgba(595959aa)
  layout = dwindle
  resize_on_border = true
  col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
}

animations {
  enabled = true
  bezier = myBezier, 0.0, 1.0, 0.0, 1.0
  animation = windows, 1, 5, myBezier
  animation = windowsOut, 1, 5, default, popin 80%
  animation = border, 1, 5, default
  animation = borderangle, 1, 5, default
  animation = fade, 1, 5, default
  animation = workspaces, 1, 3, default
}

gesture = 3, horizontal, workspace
gesture = 3, up, mod: ALT, float
gesture = 3, down, mod: ALT, float
gesture = 3, up, mod: SUPER, scale: 1.5, fullscreen
gesture = 3, down, mod: SUPER, scale: 1.5, fullscreen

debug {
  disable_logs = false
}

master {
  new_on_top = 1
  new_status = master
  mfact = 0.5
}

cursor {
  no_hardware_cursors = false
  enable_hyprcursor = true
  warp_on_change_workspace = true
}

group {
  groupbar {
    col.active = rgba(33ccffee)
  }

  col.border_active = rgba(33ccffee)
}

input {
  float_switch_override_focus = false
  repeat_delay = 300
  numlock_by_default = true
  scroll_factor = 5
  left_handed = false
  kb_layout = ro,us
  repeat_rate = 50
  touchdevice {
    enabled = true
  }

  follow_mouse = true
  touchpad {
    tap-to-click = true
    drag_lock = false
    clickfinger_behavior = true
    middle_button_emulation = false
    natural_scroll = true
    scroll_factor = 0.4
    disable_while_typing = true
  }

  tablet {
    left_handed = 0
    transform = 0
  }

}

binds {
  pass_mouse_when_bound = false
  workspace_back_and_forth = true
  allow_workspace_cycles = true
}

xwayland {
  force_zero_scaling = true
}

decoration {
  dim_inactive = true
  shadow {
    enabled = false
  }

  dim_special = 0.8
  active_opacity = 1
  fullscreen_opacity = 1
  rounding = 10
  inactive_opacity = 0.9
  blur {
    enabled = true
    passes = 3
    new_optimizations = true
    special = true
    ignore_opacity = true
    size = 3
  }

  dim_strength = 0.1
}

# Keybindings
bind = $mainMod, S, exec, ~/.config/ags/scripts/grimblast.sh --freeze copy area
bind = $mainMod+Ctrl+Alt, M, exec, hyprctl dispatch exit 0
bind = $mainMod, P, exec, $scriptsDir/LockScreen.sh
bind = Ctrl+Alt, P, exec, $scriptsDir/Wlogout.sh
bindl = $mainMod+Shift, P, exec, sleep 0.1 && systemctl suspend || loginctl suspend
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, Q, killactive,
bind = $mainMod+Shift, Q, exec, $scriptsDir/KillActiveProcess.sh
bind = $mainMod+Shift+Alt, Q, exec, hyprctl kill
bind = $mainMod+Alt, Space, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod+Ctrl, F, fullscreen, 1
bind = $mainMod, Return, exec, kitty
bind = $mainMod, E, exec, nautilus --new-window
bind = $mainMod, I, exec, XDG_CURRENT_DESKTOP="gnome" gnome-control-center
bind = Ctrl+$mainMod, V, exec, pavucontrol
bind = Ctrl+Shift, Escape, exec, gnome-system-monitor
bind = $mainMod+Shift, Return, exec, pypr toggle term
bind = $mainMod, Z, exec, pypr zoom
bindn = $mainMod, Space, exec, $scriptsDir/SwitchKeyboardLayout.sh
bindl = $mainMod, Grave, exec, $UserScripts/VM.sh
bind = $mainMod, R, exec, /home/razvan/Workspace/ai/tts-read/tts_read.sh
bind = Ctrl+$mainMod, C, exec, $UserScripts/VSCode.sh
bind = $mainMod, W, exec, qs ipc call wallpaperSelector toggle
bind = $mainMod+Alt, W, exec, qs ipc call wallpapers toggleHidden
bind = Ctrl+Alt, W, exec, qs ipc call wallpapers random
bind = $mainMod, C, exec, qs ipc call wallpapers random
bindr = Ctrl+$mainMod, R, exec, pkill quickshell; quickshell &
bind = $mainMod, A, exec, qs ipc call panelFamily cycle
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = $mainMod, 1, workspace, 1
bind = $mainMod+Shift, 1, movetoworkspace, 1
bind = $mainMod+Alt, 1, movetoworkspacesilent, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod+Shift, 2, movetoworkspace, 2
bind = $mainMod+Alt, 2, movetoworkspacesilent, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod+Shift, 3, movetoworkspace, 3
bind = $mainMod+Alt, 3, movetoworkspacesilent, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod+Shift, 4, movetoworkspace, 4
bind = $mainMod+Alt, 4, movetoworkspacesilent, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod+Shift, 5, movetoworkspace, 5
bind = $mainMod+Alt, 5, movetoworkspacesilent, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod+Shift, 6, movetoworkspace, 6
bind = $mainMod+Alt, 6, movetoworkspacesilent, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod+Shift, 7, movetoworkspace, 7
bind = $mainMod+Alt, 7, movetoworkspacesilent, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod+Shift, 8, movetoworkspace, 8
bind = $mainMod+Alt, 8, movetoworkspacesilent, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod+Shift, 9, movetoworkspace, 9
bind = $mainMod+Alt, 9, movetoworkspacesilent, 9
bind = $mainMod, 0, workspace, 10
